<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Editar usuario</title>
  </head>
  <body>
    <h1>Editar usuario</h1>

    <table>
      <form action="#" th:action="@{/users/change-username}" th:object="${usernameDTO}" method="post">
        <tr>
          <td><input type="text" th:field="*{username}" placeholder="Usuario"></td>
          <td><input type="submit" value="Cambiar"/></td>
          <td th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></td>
        </tr>
      </form>
      <form action="#" th:action="@{/users/change-email}" th:object="${emailDTO}" method="post">
        <tr>
          <td><input type="email" th:field="*{email}" placeholder="Email"></td>
          <td><input type="submit" value="Cambiar"/></td>
          <td th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></td>
        </tr>
      </form>
    </table>

    <br>
    <a th:href="@{/users/change-password}">Cambiar contraseña</a>
    <br>
    <form action="#" th:action="@{/menu}" method="get">
      <input type="submit" value="Volver"/>
    </form>
    <form action="#" th:action="@{/logout}" method="get">
      <input type="submit" value="Salir de la cuenta"/>
    </form>
  </body>
</html>
