<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Cambiar contraseña</title>
  </head>
  <body>
    <h1>Cambiar contraseña</h1>
    <form action="#" th:action="@{/users/change-password/{token}(token=${token})}" th:object="${passwordDTO}" method="post">
      <input type="password" th:field="*{password}">
      <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      <br>
      <input type="password" th:field="*{repeatedPassword}">
      <span th:if="${#fields.hasErrors('repeatedPassword')}" th:errors="*{repeatedPassword}"></span>
      <br>
      <input type="submit" value="Enviar">
    </form>
  </body>
</html>
