<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesion</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <h1>Iniciar sesion</h1>

      <div class="alert alert-error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectas</div>
      <div class="alert alert-info" th:if="${param.logout}">Cerraste sesion</div>

      <form th:action="@{/login}" method="post">
        <div class="field">
          <input type="text" name="username" placeholder="Email o usuario"
            aria-label="Username" autocomplete="username"/>
        </div>
        <div class="field">
          <input type="password" name="password" placeholder="Contraseña"
            aria-label="Password" autocomplete="current-password"/>
        </div>
        <input type="submit" value="Enviar" class="btn btn-primary btn-block"/>
      </form>

      <a class="auth-link" th:href="@{/users/new}">Registrarse</a>
      <a class="auth-link" th:href="@{/users/change-password}">Recuperar contraseña</a>
    </main>
  </body>
</html>
